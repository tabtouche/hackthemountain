<div class="scene-root">
  <div class="top">
    <canvas #videoCanvas class="video-canvas"></canvas>
    <canvas #canvas class="overlay"></canvas>
    @if (isLoading) {
      <div class="loading-overlay">Démarrage de la détection...</div>
    }
  </div>

  <div class="controls">
    <button (click)="startCamera()" [disabled]="puppetStarted">Commencer caméra</button>
    <button (click)="startRecording()" [disabled]="recording || !puppetStarted">Démarrer</button>
    <button (click)="pauseRecording()" [disabled]="!recording">Pause</button>
    <button (click)="resumeRecording()" [disabled]="recording">Reprendre</button>
    <button (click)="stopRecording()">Arrêter</button>
    <button (click)="restartRecording()">Recommencer</button>
    <button (click)="goBack()">Retour</button>
  </div>
  <app-stage></app-stage>
</div>
